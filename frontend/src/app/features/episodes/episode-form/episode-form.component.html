<div class="page">

  <header class="page-header">
    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Back
    </button>
    <h1>{{ isEdit ? 'Edit Episode' : 'Schedule New Episode' }}</h1>
  </header>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner-lg"></div><span>Loading...</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading" novalidate>

    <div class="form-grid">

      <!-- Left column -->
      <div class="form-section">
        <h2 class="section-title">Episode Info</h2>

        <div class="field">
          <label>Patient *</label>
          <select formControlName="patientId">
            <option value="">Select patient...</option>
            <option *ngFor="let p of patients" [value]="p.id">{{ p.fullName }}</option>
          </select>
          <span class="field-error" *ngIf="f['patientId'].invalid && f['patientId'].touched">
            Patient is required
          </span>
        </div>

        <div class="field">
          <label>Type *</label>
          <div class="type-grid">
            <button type="button"
              *ngFor="let t of episodeTypes"
              class="type-btn"
              [class.selected]="f['episodeType'].value === t.value"
              (click)="form.get('episodeType')?.setValue(t.value)">
              {{ t.label }}
            </button>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Doctor</label>
            <select formControlName="doctorId">
              <option value="">Not assigned</option>
              <option *ngFor="let d of doctors" [value]="d.id">{{ d.fullName }}</option>
            </select>
          </div>
          <div class="field">
            <label>Scheduled At</label>
            <input type="datetime-local" formControlName="scheduledAt"/>
          </div>
        </div>

        <div class="field">
          <label>Reason</label>
          <input type="text" formControlName="reason" placeholder="Reason for the visit..."/>
        </div>

        <div class="field">
          <label>Symptoms</label>
          <textarea formControlName="symptoms" rows="3" placeholder="Reported symptoms..."></textarea>
        </div>
      </div>

      <!-- Right column -->
      <div class="form-section">
        <h2 class="section-title">Clinical Record</h2>

        <div class="field">
          <label>Diagnosis</label>
          <textarea formControlName="diagnosis" rows="3" placeholder="Diagnosis..."></textarea>
        </div>

        <div class="field">
          <label>Prescription</label>
          <textarea formControlName="prescription" rows="3" placeholder="Medications, dosages..."></textarea>
        </div>

        <div class="field">
          <label>Notes</label>
          <textarea formControlName="notes" rows="2" placeholder="Additional notes..."></textarea>
        </div>

        <h2 class="section-title" style="margin-top: 1.25rem">Vitals</h2>

        <div class="field-row">
          <div class="field">
            <label>Blood Pressure</label>
            <input type="text" formControlName="bloodPressure" placeholder="120/80"/>
          </div>
          <div class="field">
            <label>Heart Rate (bpm)</label>
            <input type="number" formControlName="heartRate" placeholder="72"/>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Temperature (°C)</label>
            <input type="number" formControlName="temperature" placeholder="36.5" step="0.1"/>
          </div>
          <div class="field">
            <label>Weight (kg)</label>
            <input type="number" formControlName="weightKg" placeholder="70.5" step="0.1"/>
          </div>
        </div>
      </div>

    </div>

    <div class="alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="goBack()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="saving">
        <span *ngIf="!saving">{{ isEdit ? 'Save Changes' : 'Schedule Episode' }}</span>
        <span *ngIf="saving" class="saving-state">
          <span class="spinner-sm"></span> Saving...
        </span>
      </button>
    </div>

  </form>

</div>
