<div class="app-layout" [class.collapsed]="collapsed">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo" *ngIf="!collapsed">
        <span class="logo-icon">H</span>
        <span class="logo-text">Hospital<strong>AO</strong></span>
      </div>
      <div class="logo logo-sm" *ngIf="collapsed">
        <span class="logo-icon">H</span>
      </div>
      <button class="toggle-btn" (click)="toggle()">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M4 6h12M4 10h12M4 14h12"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="isActive(item.route)"
        (click)="goTo(item.route)"
        [title]="collapsed ? item.label : ''">

        <span class="nav-icon">
          <svg *ngIf="item.icon==='dashboard'" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <svg *ngIf="item.icon==='patients'" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='episodes'" viewBox="0 0 20 20" fill="none">
            <rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='scheduling'" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="3" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 8h16M7 2v2M13 2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 12h8M6 15h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='inpatient'" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="8" width="16" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 8V6a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 11v4M8 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='lab'" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 2h5M9 2v5L5 15a2 2 0 0 0 1.7 3h6.6A2 2 0 0 0 15 15l-4-8V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='pharmacy'" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 10v4M8 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='financial'" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="4" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 8h16" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="6" cy="13" r="1" fill="currentColor"/>
            <path d="M10 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='reports'" viewBox="0 0 20 20" fill="none">
            <path d="M4 2h8l4 4v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v4h4M6 9h8M6 12h8M6 15h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='users'" viewBox="0 0 20 20" fill="none">
            <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1 17c0-3 2.7-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 10a3 3 0 0 0 0-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M17 17c0-2-1.3-3.7-3-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='audit'" viewBox="0 0 20 20" fill="none">
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="2" y="2" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 7h8M6 10h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='hr'" viewBox="0 0 20 20" fill="none">
            <circle cx="7" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 16c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 8h4M16 6v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='prescriptions'" viewBox="0 0 20 20" fill="none">
            <path d="M4 2h12a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7h6M7 10h6M7 13h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M13 12l2 2-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='triage'" viewBox="0 0 20 20" fill="none">
            <path d="M10 2a8 8 0 1 0 0 16A8 8 0 0 0 10 2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6v4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='equipment'" viewBox="0 0 20 20" fill="none">
            <path d="M10 2a8 8 0 1 0 0 16A8 8 0 0 0 10 2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6v4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="item.icon==='telemedicine'" viewBox="0 0 20 20" fill="none">
            <path d="M10 2a8 8 0 1 0 0 16A8 8 0 0 0 10 2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6v4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>

        <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        <span class="active-dot" *ngIf="isActive(item.route) && collapsed"></span>
      </button>
    </nav>

    <div class="sidebar-bell">
      <app-notification-bell/>
      <span class="bell-label" *ngIf="!collapsed"
        (click)="goTo('/notifications')" style="cursor:pointer">
        Notificações
      </span>
    </div>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="!collapsed">
        <div class="user-avatar">
          {{ currentUser ? getInitials(currentUser.fullName) : 'A' }}
        </div>
        <div class="user-details">
          <span class="user-name">{{ currentUser?.fullName ?? 'Administrador' }}</span>
          <span class="user-role">{{ currentUser?.roles?.[0] ?? 'ADMIN' }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" title="Sair">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M13 6l4 4-4 4M7 10h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="user-info-sm" *ngIf="collapsed">
        <div class="user-avatar-sm" (click)="logout()" title="Sair">
          {{ currentUser ? getInitials(currentUser.fullName) : 'A' }}
        </div>
      </div>
    </div>

  </aside>

  <main class="main-content">
    <router-outlet/>
  </main>

</div>
