# ============================================================
# HospitalAO — application.yml
# ============================================================
# As variáveis ${NOME_VARIAVEL} são injectadas pelo Docker
# a partir do ficheiro .env via docker-compose.yml.
#
# Estrutura:
#   - Configurações base (activas em todos os perfis)
#   - Secção "---" separa o perfil "dev" com overrides
# ============================================================

spring:
  application:
    name: hospitalao-backend

  # Perfil activo: injectado pelo docker-compose (dev ou prod)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

  # ------------------------------------------------------------
  # BASE DE DADOS
  # ------------------------------------------------------------
  datasource:
    # Dentro da rede Docker, usamos o nome do serviço "postgres"
    # em vez de "localhost". O Docker resolve o nome para o IP do container.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospitalao}
    username: ${DB_USER:hospitalao}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool de ligações: reutiliza ligações à BD em vez de
      # abrir uma nova para cada pedido (muito mais eficiente)
      pool-name: HospitalaoPool
      maximum-pool-size: 20      # máximo de ligações simultâneas
      minimum-idle: 5            # manter 5 ligações sempre prontas
      idle-timeout: 30000        # fechar ligações inactivas após 30s
      connection-timeout: 20000  # esperar 20s antes de desistir

  jpa:
    hibernate:
      # "validate": o Hibernate verifica se as tabelas correspondem
      # às entidades Java, mas NÃO cria nem altera tabelas.
      # O Liquibase é quem gere as tabelas.
      ddl-auto: validate
    show-sql: false  # true no perfil dev (ver abaixo)
    open-in-view: false  # boa prática: não manter sessão JPA aberta na view
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Batch inserts: em vez de 20 INSERTs separados,
        # envia todos de uma vez — muito mais rápido
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ------------------------------------------------------------
  # LIQUIBASE — Migrations da base de dados
  # ------------------------------------------------------------
  liquibase:
    # Ficheiro master que lista todos os migrations por ordem
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # ------------------------------------------------------------
  # REDIS
  # ------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ------------------------------------------------------------
  # RABBITMQ
  # ------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hospitalao}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/hospitalao}
    listener:
      simple:
        # "manual": o código confirma manualmente que processou
        # a mensagem. Se falhar, a mensagem volta à fila.
        acknowledge-mode: manual
        prefetch: 1  # processar 1 mensagem de cada vez por consumer

  # ------------------------------------------------------------
  # EMAIL
  # ------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # ------------------------------------------------------------
  # UPLOAD DE FICHEIROS
  # ------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB      # tamanho máximo por ficheiro
      max-request-size: 25MB   # tamanho máximo do pedido total


# ============================================================
# SERVIDOR
# ============================================================
server:
  port: 8080
  servlet:
    # Todos os endpoints começam com /api
    # Ex: /api/pacientes, /api/auth/login
    context-path: /api


# ============================================================
# JWT — Configurações dos tokens de autenticação
# ============================================================
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}


# ============================================================
# Configuração AGT Angola — Facturação Electrónica
# ============================================================
agt:
  api-url: ${AGT_API_URL}
  enabled: ${AGT_ENABLED:false}
  username: ${AGT_USERNAME:}
  password: ${AGT_PASSWORD:}
  nif: ${AGT_NIF}
  software-id: ${AGT_SOFTWARE_ID}
  software-version: ${AGT_SOFTWARE_VERSION}
  software-validation-number: ${AGT_SOFTWARE_VALIDATION:}
  tax-exemption-code: ${AGT_TAX_EXEMPTION_CODE:}
  private-key-path: ${AGT_PRIVATE_KEY_PATH:}
  sandbox: ${AGT_SANDBOX:false}

telemedicine:
  teams:
    enabled: ${TEAMS_ENABLED:false}
    tenant-id: ${TEAMS_TENANT_ID:}
    client-id: ${TEAMS_CLIENT_ID:}
    client-secret: ${TEAMS_CLIENT_SECRET:}

app:
  base-url: ${APP_BASE_URL}
# ============================================================
# ACTUATOR — Health checks e métricas
# ============================================================
management:
  endpoints:
    web:
      exposure:
        # Expor apenas os endpoints necessários (segurança)
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true


# ============================================================
# SWAGGER UI — Documentação interactiva da API
# ============================================================
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    # Ordenar endpoints por tag e depois por nome
    tags-sorter: alpha
    operations-sorter: alpha
  # Mostrar também os endpoints do Actuator na documentação
  show-actuator: false


# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    # O nosso código: mostrar tudo (DEBUG)
    ao.hospitalao: DEBUG
    # Spring Security: só avisos e erros
    org.springframework.security: WARN
    # Hibernate SQL: só em dev (ver perfil abaixo)
    org.hibernate.SQL: WARN
  pattern:
    # Formato legível: data hora [thread] nível classe - mensagem
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    ao.hospitalao: INFO
  structured:
    format:
      console: logstash


# ============================================================
# PERFIL: dev
# Overrides específicos para desenvolvimento
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true  # Ver as queries SQL no terminal em dev
  liquibase:
    contexts: dev
    parameters:
      devAdminPasswordBase64: ${DEV_ADMIN_INITIAL_PASSWORD_BASE64}
  web:
    error:
      include-message: always
      include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}

agt:
  api-url: ${AGT_API_URL:https://sifphml.minfin.gov.ao}
  enabled: ${AGT_ENABLED:false}
  nif: ${AGT_NIF:5000413178}
  software-id: ${AGT_SOFTWARE_ID:HospitalAO}
  software-version: ${AGT_SOFTWARE_VERSION:0.0.1-SNAPSHOT}
  sandbox: ${AGT_SANDBOX:true}

logging:
  level:
    ao.hospitalao: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.security: DEBUG