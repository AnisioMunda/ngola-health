name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes e gerar cobertura
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hospitalao_test
          DB_USER: hospitalao
          DB_PASSWORD: ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ci
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: hospitalao
          RABBITMQ_PASSWORD: ci
          RABBITMQ_VHOST: /hospitalao
          # Fixture Base64 de 32 bytes; não é um segredo de produção.
          JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_BASE_URL: http://localhost:4200
          AGT_API_URL: https://sifphml.minfin.gov.ao
          AGT_ENABLED: false
          AGT_NIF: 5000000001HA044
          AGT_SOFTWARE_ID: HospitalAO
          AGT_SOFTWARE_VERSION: 0.0.1-SNAPSHOT
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify
          test -s target/site/jacoco/index.html

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Validar Dockerfiles
        run: |
          docker build --tag hospitalao-backend:ci ./backend
          docker build --tag hospitalao-frontend:ci ./frontend

  frontend:
    name: Frontend (Node 26)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Auditar dependências npm
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Executar lint
        working-directory: frontend
        run: npm run lint

      - name: Executar testes
        working-directory: frontend
        run: npm test

      - name: Compilar produção
        working-directory: frontend
        run: npm run build:prod

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Rever dependências introduzidas no PR
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  e2e:
    name: Critical E2E workflow (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hospitalao_e2e
          POSTGRES_USER: hospitalao
          POSTGRES_PASSWORD: hospitalao-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitalao -d hospitalao_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: hospitalao
          RABBITMQ_DEFAULT_PASS: hospitalao-e2e
          RABBITMQ_DEFAULT_VHOST: /hospitalao
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      E2E_DB_NAME: hospitalao_e2e
      E2E_DB_USER: hospitalao
      E2E_DB_PASSWORD: hospitalao-e2e
      E2E_REDIS_HOST: 127.0.0.1
      E2E_REDIS_PORT: 6379
      E2E_REDIS_PASSWORD: ""
      E2E_RABBITMQ_HOST: 127.0.0.1
      E2E_RABBITMQ_PORT: 5672
      E2E_RABBITMQ_USER: hospitalao
      E2E_RABBITMQ_PASSWORD: hospitalao-e2e
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium e dependências
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar fluxo clínico integrado
        working-directory: frontend
        run: npm run e2e

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Procurar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1

  homoglyph-check:
    name: Source homoglyphs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Verificar código-fonte
        run: python3 scripts/check-homoglyphs.py
