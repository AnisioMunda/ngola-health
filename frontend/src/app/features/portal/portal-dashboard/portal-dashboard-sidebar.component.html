<aside class="portal-sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">H</span>
    <span class="brand-name">Ngola Health</span>
  </div>

  <div class="patient-card">
    <div class="patient-avatar">{{ getInitials() }}</div>
    <div class="patient-info">
      <span class="patient-name">{{ user?.patientName }}</span>
      <span class="patient-email">{{ user?.email }}</span>
    </div>
  </div>

  <nav class="portal-nav" aria-label="Navegação do portal">
    <button class="nav-item" [class.active]="activeTab === 'home'" (click)="tabChange.emit('home')">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path
          d="M3 9.5L10 3l7 6.5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path d="M7 18v-6h6v6" stroke="currentColor" stroke-width="1.5" />
      </svg>
      Início
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab === 'episodes'"
      (click)="tabChange.emit('episodes')"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M7 7h6M7 10h6M7 13h4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Consultas
      <span class="nav-badge" *ngIf="(dashboard?.totalEpisodes ?? 0) > 0">
        {{ dashboard?.totalEpisodes ?? 0 }}
      </span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab === 'lab-results'"
      (click)="tabChange.emit('lab-results')"
    >
      Resultados laboratoriais
      <span class="nav-badge" *ngIf="(dashboard?.pendingLabResults ?? 0) > 0">
        {{ dashboard?.pendingLabResults ?? 0 }}
      </span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab === 'prescriptions'"
      (click)="tabChange.emit('prescriptions')"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path
          d="M4 2h12a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M7 7h6M7 10h6M7 13h3"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Prescrições
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab === 'invoices'"
      (click)="tabChange.emit('invoices')"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="4" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path d="M2 8h16" stroke="currentColor" stroke-width="1.5" />
        <circle cx="6" cy="13" r="1" fill="currentColor" />
        <path d="M10 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      Facturas
      <span class="nav-badge alert" *ngIf="(dashboard?.pendingInvoices ?? 0) > 0">
        {{ dashboard?.pendingInvoices ?? 0 }}
      </span>
    </button>
  </nav>

  <button class="logout-btn" (click)="logout.emit()">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path
        d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
      <path
        d="M13 6l4 4-4 4M7 10h10"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
    Sair
  </button>
</aside>
