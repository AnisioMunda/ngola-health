name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes e gerar cobertura
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hospitalao_test
          DB_USER: hospitalao
          DB_PASSWORD: ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ci
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: hospitalao
          RABBITMQ_PASSWORD: ci
          RABBITMQ_VHOST: /hospitalao
          # Fixture Base64 de 32 bytes; não é um segredo de produção.
          JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_BASE_URL: http://localhost:4200
          AGT_API_URL: https://sandbox.portaldoparceiro.minfin.gov.ao
          AGT_NIF: 5000000001HA044
          AGT_SOFTWARE_ID: HospitalAO
          AGT_SOFTWARE_VERSION: 0.0.1-SNAPSHOT
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify
          test -s target/site/jacoco/index.html

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Validar Dockerfiles
        run: |
          docker build --tag hospitalao-backend:ci ./backend
          docker build --tag hospitalao-frontend:ci ./frontend
