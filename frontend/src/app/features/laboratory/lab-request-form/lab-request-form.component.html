<div class="page">
  <header class="page-header">
    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      Voltar
    </button>
    <h1>Novo pedido de laboratório</h1>
  </header>

  <div class="alert-error" *ngIf="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-card">
      <div class="field">
        <label>Paciente *</label>
        <select formControlName="patientId" [disabled]="loadingPatients || !!patientsError">
          <option value="">Seleccionar paciente...</option>
          <option *ngFor="let p of patients" [value]="p.id">{{ p.fullName }}</option>
        </select>
        <span class="field-error" *ngIf="loadingPatients">A carregar pacientes...</span>
        <span class="field-error" *ngIf="patientsError">
          {{ patientsError }}
          <button type="button" class="btn-page" (click)="loadPatients()">Tentar novamente</button>
        </span>
        <span class="field-error" *ngIf="f['patientId'].invalid && f['patientId'].touched">
          Campo obrigatório.
        </span>
      </div>

      <div class="field">
        <label>Prioridade</label>
        <div class="priority-grid">
          <button
            type="button"
            *ngFor="let p of priorities"
            class="priority-btn"
            [class]="'priority-' + p.value.toLowerCase()"
            [class.selected]="f['priority'].value === p.value"
            (click)="form.get('priority')?.setValue(p.value)"
          >
            {{ p.label }}
          </button>
        </div>
      </div>

      <div class="field">
        <label>Notas clínicas</label>
        <textarea
          formControlName="clinicalNotes"
          rows="3"
          placeholder="Motivo do pedido e informação clínica relevante..."
        ></textarea>
      </div>
    </div>

    <div class="form-card">
      <h2 class="section-title">Seleccionar exames *</h2>

      <div class="tests-grid">
        <button
          type="button"
          *ngFor="let test of availableTests"
          class="test-card"
          [class.selected]="isTestSelected(test.id)"
          [disabled]="loadingTests || !!testsError || saving"
          (click)="toggleTest(test.id)"
        >
          <div class="test-check">
            <svg *ngIf="isTestSelected(test.id)" viewBox="0 0 16 16" fill="none">
              <path
                d="M3 8l4 4 6-6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="test-info">
            <span class="test-name">{{ test.name }}</span>
            <span class="test-meta">{{ test.code }} · {{ test.sampleType }}</span>
          </div>
          <span class="test-price" *ngIf="test.price !== null">{{ test.price }} Kz</span>
        </button>
      </div>

      <div class="empty-mini" *ngIf="loadingTests">A carregar o catálogo de exames...</div>
      <div class="empty-mini" *ngIf="testsError">
        {{ testsError }}
        <button type="button" class="btn-page" (click)="loadTests()">Tentar novamente</button>
      </div>
      <div class="empty-mini" *ngIf="!loadingTests && !testsError && availableTests.length === 0">
        Não existem exames activos no catálogo.
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="goBack()">Cancelar</button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="
          saving ||
          loadingPatients ||
          loadingTests ||
          !!patientsError ||
          !!testsError ||
          selectedTestIds.size === 0
        "
      >
        <span *ngIf="!saving">Criar pedido</span>
        <span *ngIf="saving" class="saving-state"
          ><span class="spinner-sm"></span> A guardar...</span
        >
      </button>
    </div>
  </form>
</div>
