services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hospitalao_e2e
      POSTGRES_USER: hospitalao
      POSTGRES_PASSWORD: hospitalao-e2e
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalao -d hospitalao_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hospitalao
      RABBITMQ_DEFAULT_PASS: hospitalao-e2e
      RABBITMQ_DEFAULT_VHOST: /hospitalao
    ports:
      - "127.0.0.1:5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    profiles: ["zap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hospitalao_e2e
      DB_USER: hospitalao
      DB_PASSWORD: hospitalao-e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: hospitalao
      RABBITMQ_PASSWORD: hospitalao-e2e
      RABBITMQ_VHOST: /hospitalao
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEV_ADMIN_INITIAL_PASSWORD_BASE64: ZGFwLXN5bnRoZXRpYy1wYXNzd29yZA==
      APP_BASE_URL: http://localhost:4201
      AGT_API_URL: https://example.invalid
      AGT_ENABLED: "false"
      AGT_NIF: "5000000001HA044"
      AGT_SOFTWARE_ID: HospitalAO-E2E
      AGT_SOFTWARE_VERSION: 0.0.1-E2E
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Actuator stays role-protected; HTTP 401 still confirms backend readiness.
      test:
        [
          "CMD-SHELL",
          "wget --server-response --spider --timeout=3 http://127.0.0.1:8080/api/actuator/health 2>&1 | grep -Eq 'HTTP/1\\.[01] (200|401)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  frontend:
    profiles: ["zap"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4201:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
