services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD no ficheiro .env}
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Define REDIS_PASSWORD no ficheiro .env}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hospitalao}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD no ficheiro .env}
      RABBITMQ_DEFAULT_VHOST: /hospitalao
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      DB_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD no ficheiro .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-hospitalao}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD no ficheiro .env}
      RABBITMQ_VHOST: /hospitalao
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET no ficheiro .env}
      APP_BASE_URL: https://${TLS_DOMAIN:?Define TLS_DOMAIN no ficheiro .env}
      AGT_API_URL: ${AGT_API_URL:?Define AGT_API_URL no ficheiro .env}
      AGT_ENABLED: ${AGT_ENABLED:-false}
      AGT_USERNAME: ${AGT_USERNAME:-}
      AGT_PASSWORD: ${AGT_PASSWORD:-}
      AGT_NIF: ${AGT_NIF:?Define AGT_NIF no ficheiro .env}
      AGT_SOFTWARE_ID: ${AGT_SOFTWARE_ID:?Define AGT_SOFTWARE_ID no ficheiro .env}
      AGT_SOFTWARE_VERSION: ${AGT_SOFTWARE_VERSION:?Define AGT_SOFTWARE_VERSION no ficheiro .env}
      AGT_PRIVATE_KEY_PATH: /run/secrets/agt-private-key.pem
      AGT_SANDBOX: ${AGT_SANDBOX:-false}
      AGT_SOFTWARE_VALIDATION: ${AGT_SOFTWARE_VALIDATION:-}
      TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_CLIENT_ID: ${TEAMS_CLIENT_ID:-}
      TEAMS_CLIENT_SECRET: ${TEAMS_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${AGT_PRIVATE_KEY_PATH:-/dev/null}
        target: /run/secrets/agt-private-key.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --server-response --spider --timeout=3 http://127.0.0.1:8080/api/actuator/health 2>&1 | grep -Eq 'HTTP/1\\.[01] (200|401)'",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - ./frontend/nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot-init:
    profiles: ["bootstrap"]
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --cert-name
      - hospitalao
      - -d
      - ${TLS_DOMAIN:?Define TLS_DOMAIN no ficheiro .env}
      - --email
      - ${CERTBOT_EMAIL:?Define CERTBOT_EMAIL no ficheiro .env}
      - --agree-tos
      - --no-eff-email
      - --non-interactive
    depends_on:
      frontend-bootstrap:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    pid: service:frontend
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --deploy-hook "kill -HUP 1" || exit 1
          sleep 12h
        done
    depends_on:
      frontend:
        condition: service_healthy

  backup:
    profiles: ["backup"]
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      DB_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      BACKUP_STORAGE_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  certbot_webroot:
  letsencrypt:
