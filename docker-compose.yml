services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      DB_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET no ficheiro .env}
      DEV_ADMIN_INITIAL_PASSWORD_BASE64: ${DEV_ADMIN_INITIAL_PASSWORD_BASE64:?Define DEV_ADMIN_INITIAL_PASSWORD_BASE64 no ficheiro .env}
      APP_BASE_URL: http://localhost:4200
      AGT_API_URL: https://sifphml.minfin.gov.ao
      AGT_ENABLED: ${AGT_ENABLED:-false}
      AGT_USERNAME: ${AGT_USERNAME:-}
      AGT_PASSWORD: ${AGT_PASSWORD:-}
      AGT_NIF: ${AGT_NIF:-5000413178}
      AGT_SOFTWARE_ID: ${AGT_SOFTWARE_ID:-HospitalAO}
      AGT_SOFTWARE_VERSION: ${AGT_SOFTWARE_VERSION:-0.0.1-SNAPSHOT}
      AGT_SOFTWARE_VALIDATION: ${AGT_SOFTWARE_VALIDATION:-}
      AGT_TAX_EXEMPTION_CODE: ${AGT_TAX_EXEMPTION_CODE:-}
      AGT_PRIVATE_KEY_PATH: /run/secrets/agt-private-key.pem
      AGT_SANDBOX: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${AGT_PRIVATE_KEY_PATH:-/dev/null}
        target: /run/secrets/agt-private-key.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Actuator stays role-protected; HTTP 401 still confirms backend readiness.
      test:
        [
          "CMD-SHELL",
          "wget --server-response --spider --timeout=3 http://127.0.0.1:8080/api/actuator/health 2>&1 | grep -Eq 'HTTP/1\\.[01] (200|401)'",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    profiles: ["backup"]
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME no ficheiro .env}
      DB_USER: ${DB_USER:?Define DB_USER no ficheiro .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro .env}
      BACKUP_STORAGE_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
