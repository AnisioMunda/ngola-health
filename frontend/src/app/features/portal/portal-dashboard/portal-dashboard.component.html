<div class="portal-layout">
  <app-portal-dashboard-sidebar
    [user]="user"
    [dashboard]="dashboard"
    [activeTab]="activeTab"
    (tabChange)="onTabChange($event)"
    (logout)="logout()"
  />

  <main class="portal-main">
    <div class="loading-state" *ngIf="loading">
      <div class="spinner-lg"></div>
      <span>A carregar...</span>
    </div>

    <div class="alert-error" *ngIf="error">{{ error }}</div>

    <app-portal-dashboard-home
      *ngIf="!loading && activeTab === 'home' && dashboard"
      [dashboard]="dashboard"
    />

    <app-portal-lab-results
      *ngIf="activeTab === 'lab-results'"
      [results]="labResults"
      [loaded]="labResultsLoaded"
    />

    <app-portal-episodes *ngIf="activeTab === 'episodes'" [episodes]="episodes" />

    <app-portal-prescriptions
      *ngIf="activeTab === 'prescriptions'"
      [prescriptions]="prescriptions"
    />

    <app-portal-invoices *ngIf="activeTab === 'invoices'" [invoices]="invoices" />
  </main>
</div>
