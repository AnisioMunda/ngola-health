<!-- admission-form.component.html -->
<div class="page">

  <header class="page-header">
    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Voltar
    </button>
    <h1>Nova Admissão</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">

      <div class="form-section">
        <h2 class="section-title">Paciente e Médico</h2>

        <div class="field">
          <label>Paciente *</label>
          <select formControlName="patientId">
            <option value="">Seleccionar paciente...</option>
            <option *ngFor="let p of patients" [value]="p.id">
              {{ p.fullName }}{{ p.phone ? ' — ' + p.phone : '' }}
            </option>
          </select>
          <span class="field-error" *ngIf="f['patientId'].invalid && f['patientId'].touched">
            Paciente obrigatório
          </span>
        </div>

        <div class="field">
          <label>Médico Responsável *</label>
          <select formControlName="responsibleDoctorId">
            <option value="">Seleccionar médico...</option>
            <option *ngFor="let d of doctors" [value]="d.id">{{ d.fullName }}</option>
          </select>
          <span class="field-error" *ngIf="f['responsibleDoctorId'].invalid && f['responsibleDoctorId'].touched">
            Médico obrigatório
          </span>
        </div>

        <div class="field">
          <label>Motivo de Internamento *</label>
          <textarea formControlName="admissionReason" rows="3"
            placeholder="Descreva o motivo do internamento..."></textarea>
          <span class="field-error" *ngIf="f['admissionReason'].invalid && f['admissionReason'].touched">
            Motivo obrigatório (mínimo 10 caracteres)
          </span>
        </div>

        <div class="field">
          <label>Alta Esperada</label>
          <input type="date" formControlName="expectedDischargeDate" [min]="minDate"/>
        </div>
      </div>

      <div class="form-section">
        <h2 class="section-title">Enfermaria e Cama</h2>

        <div class="field">
          <label>Enfermaria *</label>
          <select formControlName="wardId">
            <option value="">Seleccionar enfermaria...</option>
            <option *ngFor="let w of wards" [value]="w.id">
              {{ w.name }} ({{ w.availableBeds }} disponíveis)
            </option>
          </select>
          <span class="field-error" *ngIf="f['wardId'].invalid && f['wardId'].touched">
            Enfermaria obrigatória
          </span>
        </div>

        <div class="field">
          <label>Cama *</label>

          <div class="beds-loading" *ngIf="loadingBeds">
            <div class="spinner-sm"></div> A carregar camas...
          </div>

          <div class="beds-placeholder" *ngIf="!loadingBeds && !f['wardId'].value">
            Seleccione uma enfermaria primeiro
          </div>

          <div class="beds-empty" *ngIf="!loadingBeds && f['wardId'].value && beds.length === 0">
            Sem camas disponíveis nesta enfermaria
          </div>

          <div class="beds-grid" *ngIf="!loadingBeds && beds.length > 0">
            <button type="button"
              *ngFor="let b of beds"
              class="bed-btn"
              [class.selected]="f['bedId'].value === b.id"
              [class.reserved]="b.status === 'RESERVED'"
              (click)="form.get('bedId')?.setValue(b.id)">
              <span class="bed-num">{{ b.bedNumber }}</span>
              <span class="bed-lbl">{{ b.status === 'RESERVED' ? 'Reservada' : 'Livre' }}</span>
            </button>
          </div>

          <span class="field-error" *ngIf="f['bedId'].invalid && f['bedId'].touched">
            Seleccione uma cama
          </span>
        </div>
      </div>

    </div>

    <div class="alert-error" *ngIf="error">{{ error }}</div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="goBack()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="saving">
        <span *ngIf="!saving">Confirmar Admissão</span>
        <span *ngIf="saving" class="saving-state">
          <span class="spinner-xs"></span> A guardar...
        </span>
      </button>
    </div>

  </form>

</div>
